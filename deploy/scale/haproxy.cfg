# Layer-4 load balancer in front of identical Stalwart nodes. No session affinity is needed (any node
# serves any account). Every backend connection carries a PROXY v2 header so Stalwart sees the real
# client IP (needed for SPF, DNSBL, rate limits, auto-ban); Stalwart trusts it only from this host's
# address (SystemSettings.proxyTrustedNetworks = 172.30.0.10/32, set by setup.mjs).
# TLS is terminated by Stalwart itself, so STARTTLS on 25/587 works as on a direct connection.
global
    maxconn 20000

defaults
    mode tcp
    timeout connect 5s
    timeout client 10m     # SMTP DATA and IMAP IDLE are long-lived
    timeout server 10m
    option tcplog
    log stdout format raw local0

# Health check for every port: the node's readiness endpoint on 8080 (200 once its data store is open).
# Until setup.mjs has set proxyTrustedNetworks, nodes reject the PROXY header and show as DOWN.
frontend smtp
    bind :25
    default_backend smtp
backend smtp
    balance leastconn
    option httpchk GET /healthz/ready
    server s1 stalwart-1:25 send-proxy-v2 check port 8080 check-send-proxy
    server s2 stalwart-2:25 send-proxy-v2 check port 8080 check-send-proxy

frontend submissions
    bind :465
    default_backend submissions
backend submissions
    balance leastconn
    option httpchk GET /healthz/ready
    server s1 stalwart-1:465 send-proxy-v2 check port 8080 check-send-proxy
    server s2 stalwart-2:465 send-proxy-v2 check port 8080 check-send-proxy

frontend imaps
    bind :993
    default_backend imaps
backend imaps
    balance leastconn
    option httpchk GET /healthz/ready
    server s1 stalwart-1:993 send-proxy-v2 check port 8080 check-send-proxy
    server s2 stalwart-2:993 send-proxy-v2 check port 8080 check-send-proxy

# JMAP / admin / web over plain HTTP. In production put TLS in front (Caddy, as deploy/production does,
# or HAProxy in http mode with X-Forwarded-For and Http.clientIpSource = xForwardedFor).
frontend http
    bind :8080
    default_backend http
backend http
    balance roundrobin
    option httpchk GET /healthz/ready
    server s1 stalwart-1:8080 send-proxy-v2 check check-send-proxy
    server s2 stalwart-2:8080 send-proxy-v2 check check-send-proxy
