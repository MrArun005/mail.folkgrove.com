# Hosted mode (install.sh --hosted): the same stack, but Stalwart keeps its data in PostgreSQL, message bodies
# in an S3 bucket and counters/locks in Valkey instead of RocksDB on the local disk. One node today; more
# Stalwart nodes can later point at these same services (see deploy/scale/ and docs/research/scale.md §11).
# install.sh puts this file in COMPOSE_FILE in .env, so plain `docker compose` (and backup.sh) include it.
# Secrets (PG_PASSWORD, S3_SECRET) are generated by install.sh into .env (root only, 600, gitignored).
# Paths are relative to deploy/production (the first compose file's directory).
#
# ponytail: PostgreSQL, SeaweedFS and Valkey run on this host, one of each. To grow, move them to managed or
# replicated services (PostgreSQL primary + standby, S3 provider, Valkey Sentinel) and change the addresses.
services:
  stalwart:
    # The stores sit on a network of their own that only Stalwart (and the rclone tool) can reach: not Caddy, not
    # the account service, not monitoring. internal: no route out to the internet either.
    networks: [default, stores]
    depends_on:
      postgres: { condition: service_healthy }
      seaweedfs: { condition: service_started }
      valkey: { condition: service_started }
    environment:
      PG_PASSWORD: ${PG_PASSWORD:?run install.sh --hosted}
      S3_SECRET: ${S3_SECRET:?run install.sh --hosted}
      # Set only during install.sh's first-run bootstrap (no setup wizard when config.json exists); empty = off.
      STALWART_RECOVERY_ADMIN: ${RECOVERY_ADMIN:-}
    volumes:
      # Data store = PostgreSQL. Blob store (S3) and in-memory store (Valkey) are set by install.sh via the API.
      - ./hosted/config.json:/etc/stalwart/config.json:ro

  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: stalwart
      POSTGRES_USER: stalwart
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    healthcheck:
      # Over TCP: during first-start initdb PostgreSQL briefly answers on its socket only, then restarts.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "stalwart"]
      interval: 2s
      retries: 30
    volumes: [pg-data:/var/lib/postgresql/data]
    networks: [stores]

  # S3-compatible blob store (message bodies, attachments). Any S3 provider works instead: change the BlobStore
  # in install.sh and drop this service.
  seaweedfs:
    image: chrislusf/seaweedfs:3.97
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: stalwart
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET}
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-volume.max=0"]
    volumes: [s3-data:/data]
    networks: [stores]

  valkey:
    image: valkey/valkey:8.1-alpine
    restart: unless-stopped
    # Only counters, locks and tokens with an expiry live here; nothing to back up.
    command: ["valkey-server", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru", "--save", ""]
    networks: [stores]

  # S3 client for install.sh (creates the bucket) and backup.sh (mirrors it). Never started by `up`.
  rclone:
    image: rclone/rclone:1.68.2
    profiles: [tools]
    networks: [stores]
    environment:
      RCLONE_CONFIG_S3_TYPE: s3
      RCLONE_CONFIG_S3_PROVIDER: SeaweedFS
      RCLONE_CONFIG_S3_ENDPOINT: http://seaweedfs:8333
      RCLONE_CONFIG_S3_ACCESS_KEY_ID: stalwart
      RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${S3_SECRET}

# ponytail: Valkey has no password; only Stalwart can reach it (the stores network). Add --requirepass if anything
# else ever joins that network.
networks:
  stores:
    internal: true

volumes:
  pg-data:
  s3-data:
