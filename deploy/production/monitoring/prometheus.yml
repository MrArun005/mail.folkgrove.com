# Prometheus for one OpenMail server. Started by docker-compose.monitoring.yml (install.sh --monitoring).
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files: [/etc/prometheus/alerts.yml]

alerting:
  alertmanagers:
    - static_configs: [{ targets: ["alertmanager:9093"] }]

scrape_configs:
  # Stalwart's built-in metrics (x:Metrics.prometheus, enabled by install.sh --monitoring).
  - job_name: stalwart
    metrics_path: /metrics/prometheus
    basic_auth:
      username: prometheus
      password_file: /etc/prometheus/stalwart-password
    static_configs: [{ targets: ["stalwart:8080"] }]

  # Queue size, oldest message, per-destination retries (queue-exporter.py).
  - job_name: queue
    static_configs: [{ targets: ["queue-exporter:9101"] }]

  # Disk, CPU, memory of the host.
  - job_name: node
    static_configs: [{ targets: ["node-exporter:9100"] }]
