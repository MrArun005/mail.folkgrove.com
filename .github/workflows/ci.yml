name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      # A real Stalwart mail server, bootstrapped and seeded exactly like local dev.
      - name: Start mail server
        run: node deploy/dev-setup.mjs

      - name: Web client — install
        working-directory: web
        run: npm ci
      - name: Web client — type-check
        working-directory: web
        run: npx tsc --noEmit -p .
      - name: Web client — tests (unit + integration against the mail server)
        working-directory: web
        run: npm test
      - name: Web client — production build
        working-directory: web
        run: npm run build

      # Back, links, the phone drawer, swipe, drag to a folder, Undo: in a real browser against the same mail server.
      - name: Web client — browser tests
        working-directory: web
        run: npx playwright install --with-deps chromium && npm run e2e

      - name: Signup service — tests
        working-directory: signup
        run: npm test

      - name: Mail server logs on failure
        if: failure()
        run: docker logs openmail-stalwart | tail -200
